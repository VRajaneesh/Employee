name: CI/CD Pipeline

on:
  push:
    branches: [ main, bugfix/folder_refactor ]
  pull_request:
    branches: [ main, bugfix/folder_refactor ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      MAIL_SERVER: localhost
      MAIL_PORT: 1025
      MAIL_USE_TLS: False
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_DEFAULT_SENDER: test@example.com
      SECRET_KEY: testsecret
      JWT_SECRET_KEY: testjwtsecret
      DATABASE_URL: sqlite:///test.db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd employee_app
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start dummy SMTP server
        run: |
          python -m smtpd -c DebuggingServer -n localhost:1025 &

      - name: Run backend tests
        run: |
          PYTHONPATH=. pytest employee_app/tests --maxfail=1 --disable-warnings --html=employee_app/report.html

      # Frontend setup
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd angular
          npm ci

      - name: Run frontend tests
        run: |
          cd angular
          npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Build Angular app
        run: |
          cd angular
          npm run build -- --configuration=production

      # Docker build (optional)
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build Docker images
        run: |
          docker-compose build

      # Docker push (optional, requires secrets)
